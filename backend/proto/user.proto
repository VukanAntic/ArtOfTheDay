syntax = "proto3";

package user;

option java_multiple_files = true;
option java_package = "identityservice.identityservice.grpc.user";
option java_outer_classname = "UserProto";

service UserGrpcService {
  rpc CurrentUser (Empty) returns (UserProfile);
  rpc ChangeEmail (ChangeEmailRequest) returns (UserProfile);
  rpc ChangePassword (ChangePasswordRequest) returns (UserProfile);
  rpc ChangeName (ChangeNameRequest) returns (UserProfile);
  rpc DeleteUser (DeleteUserRequest) returns (BoolResponse);
}

message Empty {}

message UserProfile {
  string username = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}

message ChangeEmailRequest { string new_email = 1; }
message ChangePasswordRequest { string old_password = 1; string new_password = 2; }
message ChangeNameRequest { string new_first_name = 1; string new_last_name = 2; }
message DeleteUserRequest { string username = 1; }
message BoolResponse { bool success = 1; }
