limit_req_zone $binary_remote_addr zone=artwork_images:10m rate=30r/s;

server {
    listen 8085;
    server_name _;
    server_tokens off;
    root /srv/www;

    location ~ /\. {
        return 404;
    }

    location /images/ {
        limit_except GET {
            deny all;
        }
        limit_req zone=artwork_images burst=120 nodelay;
        limit_req_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
