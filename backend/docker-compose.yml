version: '3.4'

services:
  image-service:
    image: ${DOCKER_REGISTRY-}image_service
    build:
      context: .
      dockerfile: ImageService/Dockerfile
    env_file: ImageService/default.env
    environment:
      - rabbit_mq_host=rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_started
      image-db:
        condition: service_healthy

  identity-service:
    image: ${DOCKER_REGISTRY-}identity_service
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    env_file: IdentityService/default.env
    environment:
      - rabbit_mq_host=rabbitmq
    ports:
      - "9081:8081"
    depends_on:
      rabbitmq:
        condition: service_started
      identity-db:
        condition: service_healthy

  user-preferences-service:
    image: ${DOCKER_REGISTRY-}user_preferences_service
    build:
      context: .
      dockerfile: UserPreferenceService/Dockerfile
    env_file: UserPreferenceService/default.env
    environment:
      - rabbit_mq_host=rabbitmq
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq

  next-image-service:
    image: ${DOCKER_REGISTRY-}next_image_service
    build:
      context: .
      dockerfile: NextImageService/Dockerfile
    env_file: NextImageService/default.env
    environment:
      - rabbit_mq_host=rabbitmq
      - user_preference_service_url=http://user-preferences-service:8082
      - image_service_url=http://image-service:8080
    ports:
      - "8084:8084"
    depends_on:
      - rabbitmq

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8090:8090"
    depends_on:
      - next-image-service

  artwork-images:
    image: nginx:stable-alpine
    volumes:
      - ./artwork-images:/srv/www/images:ro
      - ./artwork-images.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8085:8085"

  image-db:
    image: postgres:17
    env_file: ImageService/db.env
    volumes:
      - image-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  identity-db:
    image: postgres:17
    env_file: IdentityService/db.env
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  image-db-data:
  identity-db-data:
